services:
  confluence-inspector:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "6274:6274"
      - "6277:6277"
    environment:
      - HOST=0.0.0.0
      - CLIENT_PORT=6274
      - SERVER_PORT=6277
      - MCP_AUTO_OPEN_ENABLED=false
      - MCP_PROXY_AUTH_TOKEN=${MCP_PROXY_AUTH_TOKEN:-mcp-inspector-token}
      - MCP_SERVER=confluence
      - CONFLUENCE_HOST=${CONFLUENCE_HOST:-espace.agir.orange.com}
      - CONFLUENCE_API_TOKEN=${CONFLUENCE_API_TOKEN}
      - JIRA_HOST=${JIRA_HOST:-portail.agir.orange.com}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - GITLAB_API_URL=${GITLAB_API_URL:-https://gitlab.tech.orange/api/v4}
      - GITLAB_API_TOKEN=${GITLAB_API_TOKEN}
      - SONARQUBE_URL=${SONARQUBE_URL:-https://sqaas.dos.tech.orange}
      - SONARQUBE_API_TOKEN=${SONARQUBE_API_TOKEN}
    restart: unless-stopped

  jira-inspector:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "6284:6284"
      - "6287:6287"
    environment:
      - HOST=0.0.0.0
      - CLIENT_PORT=6284
      - SERVER_PORT=6287
      - MCP_AUTO_OPEN_ENABLED=false
      - MCP_PROXY_AUTH_TOKEN=${MCP_PROXY_AUTH_TOKEN:-mcp-inspector-token}
      - MCP_SERVER=jira
      - CONFLUENCE_HOST=${CONFLUENCE_HOST:-espace.agir.orange.com}
      - CONFLUENCE_API_TOKEN=${CONFLUENCE_API_TOKEN}
      - JIRA_HOST=${JIRA_HOST:-portail.agir.orange.com}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - GITLAB_API_URL=${GITLAB_API_URL:-https://gitlab.tech.orange/api/v4}
      - GITLAB_API_TOKEN=${GITLAB_API_TOKEN}
      - SONARQUBE_URL=${SONARQUBE_URL:-https://sqaas.dos.tech.orange}
      - SONARQUBE_API_TOKEN=${SONARQUBE_API_TOKEN}
    restart: unless-stopped

  gitlab-inspector:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "6294:6294"
      - "6297:6297"
    environment:
      - HOST=0.0.0.0
      - CLIENT_PORT=6294
      - SERVER_PORT=6297
      - MCP_AUTO_OPEN_ENABLED=false
      - MCP_PROXY_AUTH_TOKEN=${MCP_PROXY_AUTH_TOKEN:-mcnspector-token}
      - MCP_SERVER=gitlab
      - CONFLUENCE_HOST=${CONFLUENCE_HOST:-espace.agir.orange.com}
      - CONFLUENCE_API_TOKEN=${CONFLUENCE_API_TOKEN}
      - JIRA_HOST=${JIRA_HOST:-portail.agir.orange.com}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - GITLAB_API_URL=${GITLAB_API_URL:-https://gitlab.tech.orange/api/v4}
      - GITLAB_API_TOKEN=${GITLAB_API_TOKEN}
      - SONARQUBE_URL=${SONARQUBE_URL:-https://sqaas.dos.tech.orange}
      - SONARQUBE_API_TOKEN=${SONARQUBE_API_TOKEN}
    restart: unless-stopped

  sonarqube-inspector:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "6304:6304"
      - "6307:6307"
    environment:
      - HOST=0.0.0.0
      - CLIENT_PORT=6304
      - SERVER_PORT=6307
      - MCP_AUTO_OPEN_ENABLED=false
      - MCP_PROXY_AUTH_TOKEN=${MCP_PROXY_AUTH_TOKEN:-mcp-inspector-token}
      - MCP_SERVER=sonarqube
      - CONFLUENCE_HOST=${CONFLUENCE_HOST:-espace.agir.orange.com}
      - CONFLUENCE_API_TOKEN=${CONFLUENCE_API_TOKEN}
      - JIRA_HOST=${JIRA_HOST:-portail.agir.orange.com}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN}
      - GITLAB_API_URL=${GITLAB_API_URL:-https://gitlab.tech.orange/api/v4}
      - GITLAB_API_TOKEN=${GITLAB_API_TOKEN}
      - SONARQUBE_URL=${SONARQUBE_URL:-https://sqaas.dos.tech.orange}
      - SONARQUBE_API_TOKEN=${SONARQUBE_API_TOKEN}
    restart: unless-stopped
