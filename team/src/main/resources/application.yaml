team:
  skills:
    directory: ${SKILLS_DIRECTORY:skills}

# Human-in-the-loop policy and cost guardrails.
# Gates default to REQUIRED — supervised autonomy is the shipped posture, and
# relaxing a gate is a deliberate, reviewable configuration change (DECISIONS.md D-007).
sdlc:
  gates:
    spec-approval:
      mode: ${GATE_SPEC_APPROVAL:REQUIRED}
    merge-approval:
      mode: ${GATE_MERGE_APPROVAL:REQUIRED}
    production-deploy:
      mode: ${GATE_PRODUCTION_DEPLOY:REQUIRED}
  budget:
    # A ceiling, not a target. Multi-agent pipelines compound token cost, and an
    # unbounded retry loop is how that becomes a bill.
    max-tokens-per-wave: ${MAX_TOKENS_PER_WAVE:1000000}
    max-stage-attempts: ${MAX_STAGE_ATTEMPTS:3}
  # Code execution for the Developer and QA stages.
  #
  # SECURITY: path confinement, a command allowlist and a timeout stop an agent's
  # mistake. They do not stop an agent's compromise. Production must run this inside
  # a container with no ambient credentials and allow-listed egress - see
  # IMPLEMENTATION_LOG.md (M4, BLOCKED). Shells are deliberately absent from the
  # allowlist: permitting sh or cmd would make the list decorative.
  executor:
    workspace-root: ${SDLC_WORKSPACE_ROOT:}
    allowed-commands: ${SDLC_ALLOWED_COMMANDS:mvn,mvnw,mvnw.cmd,gradle,gradlew,npm,node,git,java}
    default-timeout-seconds: ${SDLC_EXEC_TIMEOUT:600}
  build:
    command: ${SDLC_BUILD_COMMAND:mvn,-q,-B,compile}
    test-command: ${SDLC_TEST_COMMAND:mvn,-q,-B,test}
    timeout-seconds: ${SDLC_BUILD_TIMEOUT:900}
  worker:
    poll-interval-ms: ${WORKER_POLL_INTERVAL_MS:2000}
    batch-size: ${WORKER_BATCH_SIZE:5}
    # How long a claim may be held before the owning instance is presumed dead and
    # the stage is reclaimed. Must exceed the slowest realistic stage.
    stale-claim-seconds: ${WORKER_STALE_CLAIM_SECONDS:600}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

confluence:
  base-url: ${CONFLUENCE_BASE_URL:https://espace.agir.orange.com}
  access-token: ${CONFLUENCE_API_TOKEN:}

# Toolchain integrations. All are deterministic REST clients — no port is ever
# backed by a model call. Absent credentials degrade explicitly: SonarQube reports
# UNKNOWN (which fails the ReviewGate), Jira context is skipped and noted.
gitlab:
  base-url: ${GITLAB_BASE_URL:https://gitlab.tech.orange}
  token: ${GITLAB_API_TOKEN:}

jira:
  base-url: ${JIRA_BASE_URL:https://portail.agir.orange.com}
  email: ${JIRA_EMAIL:}
  api-token: ${JIRA_API_TOKEN:}

sonarqube:
  base-url: ${SONARQUBE_URL:https://sqaas.dos.tech.orange}
  token: ${SONARQUBE_API_TOKEN:}

spring:
  application:
    name: team
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        # Dialect intentionally not set: Hibernate auto-detects it from the JDBC
        # connection. The previous explicit MariaDBDialect drew a "does not need to
        # be specified" warning against MySQL and leaked into H2 test contexts.
        type:
          preferred_uuid_jdbc_type: CHAR
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/agile_team}
    username: ${DB_USERNAME:agile_team}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 15000
      connection-timeout: 60000
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  ai:
    anthropic:
      # SECURITY: no default. Absent env var must fail startup, never fall back to a literal.
      api-key: ${ANTHROPIC_API_KEY}
      chat:
        options:
          model: claude-sonnet-5
          max-tokens: 8192
    mcp:
      client:
        enabled: false
        request-timeout: 120s
        stdio:
          connections:
            # TODO: remove once REST-based Confluence integration is validated
            # confluence:
            #   command: ${NODE_PATH:C:/Users/Zennajeh/AppData/Roaming/nvm/v22.16.0/node.exe}
            #   args:
            #     - ${MCP_CONFLUENCE_SCRIPT:C:/Users/Zennajeh/AppData/Roaming/nvm/v22.16.0/node_modules/@atlassian-dc-mcp/confluence/bin/run.js}
            #   env:
            #     CONFLUENCE_HOST: espace.agir.orange.com
            #     CONFLUENCE_API_TOKEN: ${CONFLUENCE_API_TOKEN:}
            jira:
              command: ${NODE_PATH:C:/Users/Zennajeh/AppData/Roaming/nvm/v22.16.0/node.exe}
              args:
                - ${MCP_JIRA_SCRIPT:C:/Users/Zennajeh/AppData/Roaming/nvm/v22.16.0/node_modules/@atlassian-dc-mcp/jira/bin/run.js}
              env:
                JIRA_HOST: portail.agir.orange.com
                JIRA_API_TOKEN: ${JIRA_API_TOKEN:}
            gitlab:
              command: ${NODE_PATH:C:/Users/Zennajeh/AppData/Roaming/nvm/v22.16.0/node.exe}
              args:
                - ${MCP_GITLAB_SCRIPT:C:/Users/Zennajeh/AppData/Roaming/nvm/v22.16.0/node_modules/@zereight/mcp-gitlab/build/index.js}
              env:
                GITLAB_API_URL: https://gitlab.tech.orange/api/v4
                GITLAB_PERSONAL_ACCESS_TOKEN: ${GITLAB_API_TOKEN:}
            sonarqube:
              command: ${NODE_PATH:C:/Users/Zennajeh/AppData/Roaming/nvm/v22.16.0/node.exe}
              args:
                - ${MCP_SONARQUBE_SCRIPT:C:/Users/Zennajeh/AppData/Roaming/nvm/v22.16.0/node_modules/mcp-sonarqube/dist/index.js}
              env:
                SONARQUBE_URL: https://sqaas.dos.tech.orange
                SONARQUBE_TOKEN: ${SONARQUBE_API_TOKEN:}
