spring:
  application:
    name: reviewer-agent
  ai:
    anthropic:
      # SECURITY: no default. Absent env var must fail startup, never fall back to a literal.
      api-key: ${ANTHROPIC_API_KEY}
      chat.options:
        model: claude-opus-4-20250514

# GitLab configuration
gitlab:
  base-url: ${GITLAB_BASE_URL:https://gitlab.com}
  token: ${GITLAB_TOKEN}

# Jira configuration
jira:
  base-url: ${JIRA_BASE_URL:https://your-company.atlassian.net}
  email: ${JIRA_EMAIL}
  api-token: ${JIRA_API_TOKEN}

# SonarQube configuration
sonarqube:
  base-url: ${SONARQUBE_BASE_URL:https://sonarqube.your-company.com}
  token: ${SONARQUBE_TOKEN}
